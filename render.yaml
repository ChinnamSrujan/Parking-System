services:
  - type: web
    name: smart-parking-backend
    runtime: java
    buildCommand: cd smart-parking-backend && mvn clean package -DskipTests
    startCommand: java -jar smart-parking-backend/target/smart-parking-backend-1.0.0.jar
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
