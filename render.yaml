services:
  - type: web
    name: smart-parking-backend
    runtime: docker
    dockerfilePath: ./smart-parking-backend/Dockerfile
    dockerContext: ./smart-parking-backend
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
